name: "Hestia cache GC"
concurrency:
  group: hestia-gc
  cancel-in-progress: false
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  gc:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: Mic92/hestia@v3.1.0
        with:
          version: v3.1.0
          read-only: true
      - name: Run garbage collection
        run: |
          "$HESTIA_BIN" gc ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
